---
# Clears the Docker image cache on all managed provider nodes.
# Forces re-pull of service images on the next experiment run.
#
# Usage:
#   ./run_playbook.sh playbooks/clear_image_cache.yml -vvv --ask-vault-pass
#
# Limit to specific nodes:
#   ./run_playbook.sh playbooks/clear_image_cache.yml -vvv --ask-vault-pass --limit cortalim1.dashlab.in

- name: Clear Docker image cache on provider nodes
  hosts: managed
  become: yes
  ignore_unreachable: true
  tasks:
    - name: Prune all Docker images
      shell: docker image prune --all --force
      register: docker_prune
      become_user: "{{ ansible_user }}"

    # provider/hybridcaching.py keeps its own disk cache of image tarballs and
    # serves it BEFORE pulling, so a stale tarball (e.g. an old amd64 build) is
    # re-loaded over a newer :latest. Clear it together with Docker's images.
    # The provider runs as root, so its cache is under /root.
    - name: Clear the provider's hybrid image cache
      shell: >-
        rm -rf /root/.cache/serverless_scheduler/provider
        /home/{{ ansible_user }}/.cache/serverless_scheduler/provider

    - name: Report prune result
      debug:
        msg: "{{ inventory_hostname }}: {{ docker_prune.stdout_lines | last | default('no output') }}"
